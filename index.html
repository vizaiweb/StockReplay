<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歷史股價走勢動畫</title>
    <style>
        body {
            background-color: #111827;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .chart-container {
            background-color: #1f2937;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 800px;
        }
        .stock-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .stock-name {
            font-size: 22px;
            font-weight: bold;
        }
        .stock-price {
            font-size: 26px;
            font-weight: bold;
            font-family: monospace;
            transition: color 0.2s ease;
        }
        .date-label {
            font-size: 14px;
            color: #9ca3af;
            margin-top: 4px;
        }
        canvas {
            display: block;
            background-color: #111827;
            border-radius: 4px;
        }
        .controls {
            margin-top: 12px;
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #374151;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #4b5563;
        }
    </style>
</head>
<body>

<div class="chart-container">
    <div class="stock-info">
        <div>
            <div class="stock-name" id="stockName">載入中...</div>
            <div class="date-label" id="dateLabel">—</div>
        </div>
        <div id="stockPrice" class="stock-price">—</div>
    </div>
    <canvas id="stockCanvas" width="800" height="300"></canvas>
    <div class="controls">
        <button id="replayBtn">重新播放</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('stockCanvas');
    const ctx = canvas.getContext('2d');
    const priceDisplay = document.getElementById('stockPrice');
    const nameDisplay = document.getElementById('stockName');
    const dateDisplay = document.getElementById('dateLabel');
    const replayBtn = document.getElementById('replayBtn');

    // ====== 設定 ======
    const SYMBOL = 'TSM';                 // 股票代碼（台積電ADR）
    const API_KEY = 'uOR41h1k_SBKy18Z25BWziikTLGVSRkA';               // EODHD API Key，先用 demo 測試
    const RANGE = '1y';                   // 抓多久的歷史：1y, 6m, 3m, 1m...
    const PLAY_SPEED = 30;                // 每幀間隔(ms)，越小跑越快

    // ====== 狀態 ======
    let fullData = [];       // 完整歷史數據 [{date, close}, ...]
    let visibleCount = 0;    // 目前畫到第幾筆
    let playing = false;

    // ====== 抓取歷史數據 ======
    async function fetchHistory() {
        // EODHD 歷史數據 API
        const url = `https://eodhd.com/api/eod/${SYMBOL}.US?api_token=${API_KEY}&fmt=json&order=a&from=${getFromDate()}`;
        try {
            const res = await fetch(url);
            const json = await res.json();

            // 只取日期與收盤價
            fullData = json
                .filter(d => d.close != null)
                .map(d => ({ date: d.date, close: d.close }));

            if (fullData.length === 0) throw new Error('無數據');

            nameDisplay.textContent = `${SYMBOL} 歷史走勢`;
            startPlayback();
        } catch (err) {
            console.error(err);
            nameDisplay.textContent = '載入失敗，改用模擬數據';
            // 若 API 失敗，退回到模擬數據，保證畫面能動
            fullData = generateMockData(250);
            startPlayback();
        }
    }

    // 計算起始日期（根據 RANGE）
    function getFromDate() {
        const d = new Date();
        const map = { '1y': 365, '6m': 180, '3m': 90, '1m': 30 };
        d.setDate(d.getDate() - (map[RANGE] || 365));
        return d.toISOString().split('T')[0];
    }

    // 備用模擬數據
    function generateMockData(n) {
        const arr = [];
        let p = 100;
        const start = new Date();
        start.setDate(start.getDate() - n);
        for (let i = 0; i < n; i++) {
            p += (Math.random() - 0.48) * 2;
            const d = new Date(start);
            d.setDate(d.getDate() + i);
            arr.push({ date: d.toISOString().split('T')[0], close: p });
        }
        return arr;
    }

    // ====== 播放控制 ======
    function startPlayback() {
        visibleCount = 0;
        playing = true;
        loop();
    }

    replayBtn.addEventListener('click', () => {
        if (fullData.length > 0) startPlayback();
    });

    // ====== 繪製 ======
    function drawChart() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const data = fullData.slice(0, visibleCount);
        if (data.length < 2) return;

        const prices = data.map(d => d.close);
        let minPrice = Math.min(...prices);
        let maxPrice = Math.max(...prices);
        let priceRange = maxPrice - minPrice || 1;
        minPrice -= priceRange * 0.1;
        maxPrice += priceRange * 0.1;
        priceRange = maxPrice - minPrice;

        const paddingLeft = 20;
        const paddingRight = 20;
        const plotWidth = canvas.width - paddingLeft - paddingRight;

        // 用「完整數據長度」當 X 軸基準，讓線條由左往右長出來
        const totalPoints = fullData.length;
        const stepX = plotWidth / (totalPoints - 1);

        // 漸層
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, 'rgba(239, 68, 68, 0.15)');
        grad.addColorStop(1, 'rgba(17, 24, 39, 0)');

        // 折線
        ctx.beginPath();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ef4444';
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        for (let i = 0; i < data.length; i++) {
            const x = paddingLeft + i * stepX;
            const y = canvas.height - ((data[i].close - minPrice) / priceRange) * canvas.height;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // 填充
        const lastX = paddingLeft + (data.length - 1) * stepX;
        ctx.lineTo(lastX, canvas.height);
        ctx.lineTo(paddingLeft, canvas.height);
        ctx.fillStyle = grad;
        ctx.fill();

        // 最新點
        const lastY = canvas.height - ((data[data.length - 1].close - minPrice) / priceRange) * canvas.height;
        ctx.beginPath();
        ctx.arc(lastX, lastY, 5, 0, 2 * Math.PI);
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ef4444';
        ctx.fill();
        ctx.shadowBlur = 0;

        // 更新文字
        const last = data[data.length - 1];
        const prev = data[data.length - 2] || last;
        const change = last.close - prev.close;
        priceDisplay.textContent = last.close.toFixed(2);
        priceDisplay.style.color = change >= 0 ? '#ef4444' : '#22c55e';
        dateDisplay.textContent = last.date;
    }

    // ====== 動畫循環 ======
    function loop() {
        if (!playing) return;

        // 每幀增加幾筆，控制播放速度
        visibleCount += Math.max(1, Math.floor(fullData.length / 300));

        if (visibleCount >= fullData.length) {
            visibleCount = fullData.length;
            playing = false;
        }

        drawChart();

        if (playing) {
            setTimeout(() => requestAnimationFrame(loop), PLAY_SPEED);
        }
    }

    // 啟動
    fetchHistory();
</script>

</body>
</html>
